<!-- Google Analytics 4 (GA4) Integration -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MEASUREMENT_ID"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-MEASUREMENT_ID', {
    page_path: window.location.pathname + window.location.hash
  });

  // Track Storybook story navigation
  function sendStoryPageView() {
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.hash,
        story_id: window.location.search || window.location.hash
      });
    }
  }

  window.addEventListener('hashchange', sendStoryPageView);
  window.addEventListener('popstate', sendStoryPageView);
  
  // Custom Storybook channel listener for active story changes
  document.addEventListener('DOMContentLoaded', function () {
    const observer = new MutationObserver(function () {
      sendStoryPageView();
    });
    observer.observe(document.querySelector('title') || document.head, {
      subtree: true,
      characterData: true,
      childList: true
    });
  });
</script>
